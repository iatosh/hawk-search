name: Feature
description: A group of new functionality, the parent of Tasks. Has no branch of its own.
labels: ["type:feature"]
body:
  - type: markdown
    attributes:
      value: Set dependencies in the sidebar under Relationships (Blocked by), not in the text.
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Pick the most specific one. Applied as a label.
      options:
        - area:core
        - area:adapters
        - area:cli
        - area:config
        - area:docs
        - area:tests
        - area:dev
        - area:release
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Applied as a label. Blockers decide order first; priority chooses among ready issues.
      options:
        - priority:medium
        - priority:high
        - priority:urgent
        - priority:low
      default: 0
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: Purpose
      description: What is true once every sub-issue is closed.
    validations:
      required: true
  - type: textarea
    id: parts
    attributes:
      label: Parts
      description: One line per planned sub-issue. Create each as a Task and add it as a sub-issue.
      value: |
        - Task:
    validations:
      required: true
  - type: textarea
    id: design-references
    attributes:
      label: Design references
      description: Full links to docs on main.
