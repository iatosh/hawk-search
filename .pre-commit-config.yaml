# Install once per clone:
#   uv run pre-commit install --hook-type pre-commit --hook-type commit-msg --hook-type pre-push
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format --check
        entry: uv run ruff format --check
        language: system
        types: [python]

      - id: conventional-commit
        name: commit summary is a Conventional Commit
        # <type>[(scope)][!]: <lowercase summary, no trailing period>
        entry: '\A(feat|fix|docs|refactor|chore|test)(\([a-z0-9-]+\))?!?: [a-z0-9`][^\n]*[^.\n]\n'
        language: pygrep
        args: [--multiline, --negate]
        stages: [commit-msg]

      - id: branch-name
        name: branch name is issue-<n>-<slug>
        entry: bash -c 'b=$(git rev-parse --abbrev-ref HEAD); [[ $b == main || $b =~ ^issue-[0-9]+-[a-z0-9-]+$ ]] || { echo "branch \"$b\" must be issue-<n>-<slug>"; exit 1; }'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
